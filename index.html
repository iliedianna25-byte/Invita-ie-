<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Invitație Balul Bobocilor 2026</title>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-tap-highlight-color: transparent; }
    body {
      background-color: #0b0c10;
      background-image: 
        radial-gradient(circle at 50% 20%, rgba(255, 0, 127, 0.2) 0%, transparent 60%),
        radial-gradient(circle at 80% 80%, rgba(0, 240, 255, 0.15) 0%, transparent 60%);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: sans-serif;
      overflow: hidden;
      padding: 16px;
    }

    .retro-stars {
      position: fixed;
      inset: 0;
      pointer-events: none;
      background-image: 
        radial-gradient(1.5px 1.5px at 15% 25%, #fff 100%, transparent),
        radial-gradient(2px 2px at 85% 15%, #00f0ff 100%, transparent),
        radial-gradient(2px 2px at 70% 75%, #ff007f 100%, transparent),
        radial-gradient(1.5px 1.5px at 20% 85%, #ffe600 100%, transparent);
      z-index: 1;
    }

    .envelope-wrapper {
      position: relative;
      width: 310px;
      height: 215px;
      perspective: 1200px;
      cursor: pointer;
      z-index: 5;
      transition: transform 0.3s ease;
    }

    .envelope-wrapper:active { transform: scale(0.97); }

    .envelope {
      position: relative;
      width: 100%;
      height: 100%;
      background: #1c1a24;
      border-radius: 0 0 12px 12px;
      box-shadow: 0 20px 45px rgba(0, 0, 0, 0.8), 0 0 30px rgba(0, 240, 255, 0.25);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .envelope-flap {
      position: absolute;
      top: 0;
      left: 0;
      width: 0;
      height: 0;
      border-left: 155px solid transparent;
      border-right: 155px solid transparent;
      border-top: 120px solid #282436;
      transform-origin: top center;
      transition: transform 0.65s cubic-bezier(0.4, 0, 0.2, 1);
      z-index: 4;
      filter: drop-shadow(0 4px 6px rgba(0,0,0,0.5));
    }

    .envelope-pocket {
      position: absolute;
      inset: 0;
      border-left: 155px solid #17151e;
      border-right: 155px solid #17151e;
      border-bottom: 105px solid #201d2a;
      border-top: 105px solid transparent;
      border-radius: 0 0 12px 12px;
      z-index: 3;
      pointer-events: none;
    }

    .wax-seal {
      position: absolute;
      top: 80px;
      left: 50%;
      transform: translateX(-50%);
      width: 54px;
      height: 54px;
      background: radial-gradient(circle at 35% 35%, #ff2a85, #99003d);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 15px rgba(0,0,0,0.7), 0 0 12px rgba(255, 0, 127, 0.6);
      z-index: 5;
      transition: opacity 0.4s ease, transform 0.4s ease;
      font-size: 24px;
      color: #ffe600;
    }

    .tap-hint {
      position: absolute;
      bottom: -45px;
      left: 50%;
      transform: translateX(-50%);
      color: #00f0ff;
      font-size: 13px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 2px;
      white-space: nowrap;
      animation: pulse 1.6s infinite ease-in-out;
      text-shadow: 0 0 8px rgba(0, 240, 255, 0.7);
    }

    @keyframes pulse {
      0%, 100% { transform: translateX(-50%) scale(1); opacity: 0.8; }
      50% { transform: translateX(-50%) scale(1.06); opacity: 1; }
    }

    .card {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) scale(0.4);
      width: 90%;
      max-width: 420px;
      z-index: 100;
      opacity: 0;
      pointer-events: none;
      transition: all 0.75s cubic-bezier(0.18, 0.89, 0.32, 1.25);
      border-radius: 14px;
      box-shadow: 0 25px 60px rgba(0,0,0,0.95);
      background: transparent;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .card.opened {
      transform: translate(-50%, -50%) scale(1);
      opacity: 1;
      pointer-events: auto;
    }

    .card img {
      width: 100%;
      height: auto;
      max-height: 82vh;
      object-fit: contain;
      border-radius: 12px;
      display: block;
      box-shadow: 0 8px 30px rgba(0,0,0,0.8);
    }

    .close-btn {
      margin-top: 10px;
      background: #ff007f;
      color: #fff;
      border: 1px solid #ffe600;
      padding: 9px 24px;
      border-radius: 20px;
      font-weight: bold;
      font-size: 13px;
      cursor: pointer;
      text-transform: uppercase;
      letter-spacing: 1px;
      box-shadow: 0 4px 15px rgba(255,0,127,0.5);
    }
  </style>
</head>
<body>

  <div class="retro-stars"></div>

  <div class="envelope-wrapper" id="envelopeWrapper" onclick="openEnvelope()">
    <div class="envelope">
      <div class="envelope-flap" id="flap"></div>
      <div class="wax-seal" id="seal">★</div>
      <div class="envelope-pocket"></div>
    </div>
    <div class="tap-hint" id="hint">Apasă pentru a deschide ✉</div>
  </div>

  <div class="card" id="card">
    <img src="invitatie.jpg" alt="Invitație Balul Bobocilor 2026">
    <button class="close-btn" onclick="closeCard(event)">Închide ✕</button>
  </div>

  <script>
    function openEnvelope() {
      document.getElementById('flap').style.transform = 'rotateX(180deg)';
      document.getElementById('seal').style.opacity = '0';
      document.getElementById('hint').style.opacity = '0';

      confetti({
        particleCount: 80,
        spread: 70,
        origin: { y: 0.6 },
        colors: ['#00f0ff', '#ff007f', '#ffe600', '#ffffff']
      });

      setTimeout(() => {
        document.getElementById('card').classList.add('opened');
      }, 350);
    }

    function closeCard(e) {
      e.stopPropagation();
      document.getElementById('card').classList.remove('opened');
      setTimeout(() => {
        document.getElementById('flap').style.transform = 'rotateX(0deg)';
        document.getElementById('seal').style.opacity = '1';
        document.getElementById('hint').style.opacity = '1';
      }, 350);
    }
  </script>
</body>
</html>
